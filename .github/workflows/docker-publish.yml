name: Docker Publish

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: login to container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and Publish the docker image
        run: |
          docker build . --tag ghcr.io/yogeshkatari56/skills-publish-docker-images/stackoverflown:main
          docker push ghcr.io/yogeshkatari56/skills-publish-docker-images/stackoverflown:main
